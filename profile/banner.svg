<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#e6dfd3" />
    </pattern>
    <radialGradient id="fade" cx="80%" cy="28%" r="55%">
      <stop offset="40%" stop-color="#000" stop-opacity="1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <mask id="dot-mask">
      <rect width="1200" height="460" fill="url(#fade)" />
    </mask>
    <clipPath id="frame">
      <rect x="2" y="2" width="1196" height="456" rx="28" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="#fefdfb" />
    <rect width="1200" height="460" fill="url(#dots)" mask="url(#dot-mask)" />

    <g fill="none" stroke-linecap="round">
      <path d="M 760 130 C 840 240, 900 100, 980 200" stroke="#8b9a6e" stroke-width="2" />
      <path d="M 980 200 C 1040 240, 1060 160, 1130 190" stroke="#8b9a6e" stroke-width="2" stroke-dasharray="5 5" />
    </g>
    <circle cx="760" cy="130" r="7" fill="#fefdfb" stroke="#56613f" stroke-width="2.5" />
    <circle cx="980" cy="200" r="7" fill="#fefdfb" stroke="#56613f" stroke-width="2.5" />
    <circle cx="1130" cy="190" r="7" fill="#fefdfb" stroke="#6c7a52" stroke-width="2" stroke-dasharray="2 2" />
  </g>
  <rect x="2" y="2" width="1196" height="456" rx="28" fill="none" stroke="#6c7a52" stroke-width="2" />

  <g transform="translate(64,100) scale(2.5)">
    <circle cx="5" cy="7" r="3" fill="#1f2219" />
    <circle cx="19" cy="17" r="3" fill="#1f2219" />
    <path d="M5 7 C 10 16, 14 8, 19 17" fill="none" stroke="#6c7a52" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <text x="170" y="150" font-family="Archivo, Helvetica, Arial, sans-serif" font-weight="800" font-size="60" letter-spacing="-1.5" fill="#1f2219">Strand</text>
  <text x="170" y="186" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" font-size="19" fill="#56613f">Super Intelligent Notetaking for you and your agents.</text>

  <rect x="170" y="212" width="300" height="34" rx="10" fill="#ffffff" stroke="#eee8de" stroke-width="1.5" />
  <circle cx="190" cy="229" r="5" fill="#8b9a6e" />
  <text x="207" y="234" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" font-size="13" fill="#1f2219">Works with your agents</text>

  <line x1="64" y1="288" x2="1136" y2="288" stroke="#eee8de" stroke-width="1.5" />
  <text x="64" y="318" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" font-size="13" letter-spacing="0.4" fill="#56613f">READS AND WRITES DIRECTLY, VIA MCP</text>

  <g font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="64" y="340" width="346" height="92" rx="14" fill="#ffffff" stroke="#eee8de" stroke-width="1.5" />
    <text x="86" y="378" font-weight="600" font-size="16" fill="#56613f">add_to_notebook</text>
    <text x="86" y="404" font-weight="400" font-size="13" fill="#66625a" font-family="Geist, ui-sans-serif, sans-serif">Cards and strings, as suggestions</text>

    <rect x="427" y="340" width="346" height="92" rx="14" fill="#ffffff" stroke="#eee8de" stroke-width="1.5" />
    <text x="449" y="378" font-weight="600" font-size="16" fill="#56613f">add_to_inbox</text>
    <text x="449" y="404" font-weight="400" font-size="13" fill="#66625a" font-family="Geist, ui-sans-serif, sans-serif">Things to sort later</text>

    <rect x="790" y="340" width="346" height="92" rx="14" fill="#ffffff" stroke="#eee8de" stroke-width="1.5" />
    <text x="812" y="378" font-weight="600" font-size="16" fill="#56613f">read_notebook</text>
    <text x="812" y="404" font-weight="400" font-size="13" fill="#66625a" font-family="Geist, ui-sans-serif, sans-serif">Only the boards you allow</text>
  </g>
</svg>
