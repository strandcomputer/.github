<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#e6dfd3" />
    </pattern>
    <radialGradient id="fade" cx="78%" cy="45%" r="55%">
      <stop offset="40%" stop-color="#000" stop-opacity="1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <mask id="dot-mask">
      <rect width="1200" height="400" fill="url(#fade)" />
    </mask>
    <clipPath id="frame">
      <rect x="2" y="2" width="1196" height="396" rx="28" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#fefdfb" />
    <rect width="1200" height="400" fill="url(#dots)" mask="url(#dot-mask)" />

    <g fill="none" stroke-linecap="round">
      <path d="M 760 140 C 840 250, 900 110, 980 210" stroke="#8b9a6e" stroke-width="2" />
      <path d="M 980 210 C 1040 250, 1060 170, 1130 200" stroke="#8b9a6e" stroke-width="2" stroke-dasharray="5 5" />
    </g>
    <circle cx="760" cy="140" r="7" fill="#fefdfb" stroke="#56613f" stroke-width="2.5" />
    <circle cx="980" cy="210" r="7" fill="#fefdfb" stroke="#56613f" stroke-width="2.5" />
    <circle cx="1130" cy="200" r="7" fill="#fefdfb" stroke="#6c7a52" stroke-width="2" stroke-dasharray="2 2" />
  </g>
  <rect x="2" y="2" width="1196" height="396" rx="28" fill="none" stroke="#6c7a52" stroke-width="2" />

  <g transform="translate(88,124) scale(2.7)">
    <circle cx="5" cy="7" r="3" fill="#1f2219" />
    <circle cx="19" cy="17" r="3" fill="#1f2219" />
    <path d="M5 7 C 10 16, 14 8, 19 17" fill="none" stroke="#6c7a52" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <text x="200" y="175" font-family="Archivo, Helvetica, Arial, sans-serif" font-weight="800" font-size="64" letter-spacing="-1.5" fill="#1f2219">Strand</text>
  <text x="200" y="213" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" font-size="20" fill="#56613f">Super Intelligent Notetaking for you and your agents.</text>

  <rect x="200" y="244" width="300" height="36" rx="10" fill="#ffffff" stroke="#eee8de" stroke-width="1.5" />
  <circle cx="221" cy="262" r="5" fill="#8b9a6e" />
  <text x="238" y="267" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" font-size="14" fill="#1f2219">Works with your agents</text>
</svg>
